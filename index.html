<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro de Currículo</title>
</head>

<body>
    <div class="container">

        <h1>Cadastro de Currículo</h1>

        <input type="text" id="nome" placeholder="Digite seu nome">

        <input type="email" id="email" placeholder="Digite seu email">

        <input type="text" id="telefone" placeholder="Digite seu telefone">

        <input type="file" id="arquivo" accept=".pdf,.doc,.docx">

        <button onclick="enviarCurriculo()">
            Enviar Currículo
        </button>

        <p id="resultado"></p>

        <a id="download" href="comprovante.pdf" download style="display: none;">
            Baixar comprovante
        </a>

    </div>

    <script src="script.js"></script>
</body>

</html>
